<div class="min-h-screen flex items-center justify-center bg-[#f8f9ff] relative">

    <!-- LEFT IMAGE -->
    <div class="hidden lg:block absolute left-0 top-0 h-full w-1/3">
        <img src="assets/logging.png" class="h-full w-full object-cover opacity-20">
    </div>

    <!-- CONTENT -->
    <main class="w-full max-w-[440px] z-10">

        <!-- HEADER -->
        <div class="flex flex-col items-center mb-8">

            <div class="p-3 rounded-xl mb-4 flex justify-center">
                <img src="assets/ManKiwwa.png" class="w-24 h-24 object-contain">
            </div>

            <h1 class="text-3xl font-bold">
                Reset Password
            </h1>

        </div>

        <!-- CARD -->
        <div class="bg-white p-6 rounded-xl shadow">

            <form [formGroup]="forgotForm" (ngSubmit)="submit()">

                <!-- NOTICE -->
                <div class="mb-5 text-sm text-gray-600 border-l-4 border-primary-container pl-3">

                    Enter your registered Officer ID or email to receive a reset link.

                </div>

                <!-- USERNAME -->
                <div class="mb-5 relative">

                    <label class="text-sm">
                        Officer ID / Email
                    </label>

                    <span class="material-symbols-outlined absolute left-3 top-9 text-gray-400">
                        alternate_email
                    </span>

                    <input type="text" formControlName="username" class="w-full pl-10 p-3 border rounded mt-1"
                        placeholder="Enter Officer ID or Email">

                </div>

                <!-- BUTTON -->
                <button type="submit" [disabled]="loading"
                    class="w-full bg-primary text-white p-3 rounded hover:bg-gray-800 transition">

                    {{ loading ? 'Sending...' : 'Send Reset Link' }}

                </button>

            </form>

            <!-- MESSAGE -->
            <p class="text-center mt-4 text-sm text-green-600">

                {{ message }}

            </p>

            <!-- BACK -->
            <div class="text-center mt-6">

                <button type="button" class="text-on-surface-dim hover:underline" (click)="openBackLogin()">

                    Back To Login

                </button>

            </div>

            <!-- SUPPORT -->
            <!-- <div class="mt-6 pt-4 border-t text-center">

                <p class="text-sm text-gray-500">

                    Need assistance?

                </p>

                <div class="flex justify-center gap-4 mt-2">

                    <button class="flex items-center gap-1 text-sm">

                        </span>

                        IT Support

                    </button>

                    <span>|</span>

                    <button class="flex items-center gap-1 text-sm">

                        <span class="material-symbols-outlined text-sm">

                        </span>

                        Portal Guide

                    </button>

                </div>

            </div> -->

        </div>

        <!-- STATUS -->

            <div class="flex justify-center items-center gap-2">

                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>

                Password Recovery Service: Online

            </div>

        </div> -->

        </div>

    </main>

</div>
