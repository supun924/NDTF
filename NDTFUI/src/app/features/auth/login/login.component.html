<div class="min-h-screen flex items-center justify-center bg-[#f8f9ff] relative">

  <!-- LEFT SIDE IMAGE -->
  <div class="hidden lg:block absolute left-0 top-0 h-full w-1/3">
    <img src="assets/logging.png" class="h-full w-full object-cover opacity-20" />
  </div>

  <!-- LOGIN WRAPPER -->
  <main class="w-full max-w-[440px] z-10">

    <!-- HEADER -->
    <div class="flex flex-col items-center mb-8">

      <div class="p-3 rounded-xl mb-4 flex justify-center">
        <img src="assets/ManKiwwa.png" class="w-24 h-24 object-contain">
      </div>

      <h1 class="text-3xl font-bold">Police Web Portal</h1>
    </div>

    <!-- LOGIN CARD -->
    <div class="bg-white p-6 rounded-xl shadow">

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <!-- SECURITY NOTICE -->
        <div class="mb-4 text-sm text-gray-600 border-l-4 border-primary-container pl-3">
          This is a restricted government system. Unauthorized access is prohibited.
        </div>

        <!-- USERNAME -->
        <div class="mb-4 relative">
          <label class="text-sm">Officer ID / Username</label>

          <span class="material-symbols-outlined absolute left-3 top-9 text-gray-400">
            badge
          </span>

          <input formControlName="username" type="text" class="w-full pl-10 p-3 border rounded mt-1"
            placeholder="Enter your ID number" />
        </div>

        <!-- PASSWORD -->
        <div class="mb-4 relative">
          <label class="text-sm">Secure Password</label>

          <span class="material-symbols-outlined absolute left-3 top-9 text-gray-400">
            lock
          </span>

          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            class="w-full pl-10 p-3 border rounded mt-1" placeholder="••••••••" />

          <button type="button" class="absolute right-3 top-9 text-gray-500" (click)="togglePassword()">
            <span class="material-symbols-outlined">
              visibility
            </span>
          </button>
        </div>

        <!-- OPTIONS -->
        <div class="flex justify-between items-center text-sm mb-4">
          <label class="flex items-center gap-2">
            <input type="checkbox" />
            Remember device
          </label>

          <button type="button" class="text-on-surface-dim hover:underline" (click)="openForgotPassword()">

            Forgot Password?

          </button>
        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="w-full bg-primary text-white p-3 rounded hover:bg-gray-800 transition">
          Secure Login
        </button>

      </form>

      <!-- MESSAGE -->
      <p class="text-center mt-4 text-sm text-green-600">
        {{ message }}
      </p>
